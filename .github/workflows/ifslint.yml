name: ifslint
on: [push, pull_request]
jobs:
  lint-buildfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build && npm test
      - run: node dist/cli.js examples/good.build --tree
